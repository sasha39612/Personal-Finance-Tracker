name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request. Focus on correctness bugs, security issues
            (especially around auth, financial data handling, and input validation),
            and any obvious simplification or efficiency improvements. Keep feedback
            concise and actionable. Post the review as a comment on the PR.
          claude_args: |
            --allowed-tools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*)"
